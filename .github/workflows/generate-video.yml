name: Generate Cartoon Video (Advanced)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (Gemini khud script likhega)"
        required: true
        default: "A brave little cat who saves a village from a storm"
      num_scenes:
        description: "Number of 8-sec scenes (8 = ~64 sec)"
        required: true
        default: "8"
      style_mode:
        description: "Style: 'random' ya specific style id (tom_jerry, pixar_3d, anime_cel, etc.)"
        required: true
        default: "random"
      resolution:
        description: "Resolution: 720p | 1080p | 4k"
        required: true
        default: "1080p"
      aspect_ratio:
        description: "Aspect ratio: 16:9 (landscape) | 9:16 (portrait/Reels)"
        required: true
        default: "16:9"
      generate_audio:
        description: "Generate native audio? true | false"
        required: true
        default: "true"
      release_tag:
        description: "Release tag (e.g. v1.0)"
        required: true
        default: "v1.0"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify FFmpeg
        run: ffmpeg -version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate cartoon video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
          NUM_SCENES: ${{ github.event.inputs.num_scenes }}
          STYLE_MODE: ${{ github.event.inputs.style_mode }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
          ASPECT_RATIO: ${{ github.event.inputs.aspect_ratio }}
          GENERATE_AUDIO: ${{ github.event.inputs.generate_audio }}
          OUTPUT_FILE: cartoon_video.mp4
        run: python generate_video.py

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-video-${{ github.run_number }}
          path: |
            cartoon_video.mp4
            video_metadata.json
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "🎬 Cartoon Video ${{ github.event.inputs.release_tag }}"
          body: |
            ## 🎬 Cartoon Video Release

            **Topic:** ${{ github.event.inputs.topic }}
            **Style:** ${{ github.event.inputs.style_mode }}
            **Scenes:** ${{ github.event.inputs.num_scenes }} × 8 sec
            **Resolution:** ${{ github.event.inputs.resolution }}
            **Aspect:** ${{ github.event.inputs.aspect_ratio }}
            **Audio:** ${{ github.event.inputs.generate_audio }}

            Generated by: Gemini (script) + Veo 3.1 (video) + FFmpeg (join)

            ⬇️ Download the `.mp4` below.
          files: |
            cartoon_video.mp4
            video_metadata.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
